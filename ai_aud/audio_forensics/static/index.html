<!DOCTYPE html>
<html lang="en">
<head>

  <link rel="stylesheet" href="/static/module.css" />

      padding: 2rem 1rem;
      background: #090d16;

      justify-content: center;
      min-height: 100vh;
    }
    .main-container {
      width: 100%;

        console.error("initModule is not defined.");

    });
